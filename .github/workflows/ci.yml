name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ── TypeScript build & lint ─────────────────────────────────────────────────
  test-typescript:
    name: TypeScript Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-test
        run: npm run test

      - name: Build (package)
        id: npm-package
        run: npm run package

  # ── Integration test matrix ─────────────────────────────────────────────────
  test-action:
    name: Integration Test (${{ matrix.os }} / ${{ matrix.method }})
    runs-on: ${{ matrix.os }}
    needs: test-typescript

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        method: [auto, npm, release]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Node.js (for npm method)
        if: matrix.method == 'npm' || matrix.method == 'auto'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Test Local Action
        id: setup-unistack
        uses: ./
        with:
          install_method: ${{ matrix.method }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'true'

      - name: Print Outputs
        id: print-outputs
        shell: bash
        run: |
          echo "cache-hit     = ${{ steps.setup-unistack.outputs.cache-hit }}"
          echo "unistack-version = ${{ steps.setup-unistack.outputs.unistack-version }}"
          echo "install-method = ${{ steps.setup-unistack.outputs.install-method }}"

      - name: Verify unistack in PATH
        shell: bash
        run: unistack version

  # ── go install method test ──────────────────────────────────────────────────
  test-action-go:
    name: Integration Test (${{ matrix.os }} / go)
    runs-on: ${{ matrix.os }}
    needs: test-typescript

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          cache: false

      - name: Test Local Action (go method)
        id: setup-unistack
        uses: ./
        with:
          install_method: go
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify unistack in PATH
        shell: bash
        run: unistack version

  # ── pip install method test ──────────────────────────────────────────────────
  test-action-pip:
    name: Integration Test (${{ matrix.os }} / pip)
    runs-on: ${{ matrix.os }}
    needs: test-typescript

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Test Local Action (pip method)
        id: setup-unistack
        uses: ./
        with:
          install_method: pip
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify unistack in PATH
        shell: bash
        run: unistack version
  #
  # ── Release Orchestration ───────────────────────────────────────────────────
  release-please:
    name: '🚀 Release Orchestration'
    needs: [test-action, test-action-go, test-action-pip]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: '📝 Orchestrate Release Lifecycle (Release Please)'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
          release-type: node
          target-branch: ${{ github.ref_name }}
